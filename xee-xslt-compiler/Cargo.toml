[package]
name = "xee-xslt-compiler"
version = "0.1.6"
edition = "2021"
authors = ["The Xee Project Developers"]
keywords = ["xml", "xslt"]
license = "MIT"
description = "XSLT 3.0 compiler to Xee IR"
repository = "https://github.com/Paligo/xee"
readme = "README.md"
documentation = "https://docs.rs/xee-xslt"
homepage = "https://github.com/Paligo/xee"

[features]
serde = [
    "xee-xslt-ast/serde",
    "xee-interpreter/serde",
    "xee-ir/serde",
    "dep:serde",
    "dep:rmp-serde",
    "xot/serde",
    "ahash/serde",
    "iri-string/serde",
]

[dependencies]
xee-name = { path = "../xee-name", version = "0.1.5" }
xee-xpath-ast = { path = "../xee-xpath-ast", version = "0.1.4" }
xee-xpath-compiler = { path = "../xee-xpath-compiler", version = "0.1.5" }
xee-xslt-ast = { path = "../xee-xslt-ast", version = "0.1.6" }
xee-schema-type = { path = "../xee-schema-type", version = "0.1.4" }
xee-interpreter = { path = "../xee-interpreter", version = "0.2.0" }
xee-ir = { path = "../xee-ir", version = "0.1.5" }
serde = { workspace = true, features = ["derive"], optional = true }
rmp-serde = { version = "1", optional = true }
ahash = { workspace = true }
iri-string = { workspace = true }
icu_properties = { workspace = true }
ordered-float = { workspace = true }
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
ibig = { workspace = true }
thiserror = { workspace = true }
xot = { workspace = true }


[dev-dependencies]
insta = { workspace = true, features = ["yaml", "glob"] }
rust_decimal_macros = { workspace = true }
